trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'Azure-Enterprise-Service-Connection'
  webAppName: 'radya-labs-app-prod'
  dockerRegistryServiceConnection: 'Azure-Container-Registry-Connection'
  imageRepository: 'radya-labs-nextjs'
  containerRegistry: 'radyalabsacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build & Push Docker Image to Azure Container Registry
    jobs:
      - job: BuildJob
        steps:
          - task: Docker@2
            displayName: Build and Push Image
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to Azure Web App for Containers
    dependsOn: Build
    jobs:
      - job: DeployJob
        steps:
          - task: AzureWebAppContainer@1
            displayName: Azure Web App Container Deploy
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              containers: $(containerRegistry)/$(imageRepository):$(tag)
